<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazer.bg - Очаквайте скоро</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1F2124 0%, #D4AF37 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-align: center;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            width: 100%;
            box-sizing: border-box;
        }

        .logo-container {
            margin-bottom: 30px;
        }

        .logo-container img {
            max-width: 200px;
            width: 100%;
            height: auto;
            border-radius: 50%; /* Optional: if the logo is circular */
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .message {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 40px;
            font-weight: 300;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            color: #ffffff;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid rgba(212, 175, 55, 0.3);
            font-size: 24px;
        }

        .social-btn:hover {
            background-color: #D4AF37;
            color: #1F2124;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        /* Mobile adjustments */
        @media (max-width: 480px) {
            .message {
                font-size: 1rem;
                padding: 0 10px;
            }

            .logo-container img {
                max-width: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <!-- Placeholder for the uploaded logo. In a real deployment, replace src with the actual path -->
            <img src="./lazer-logo.jpg" alt="Lazer.bg Logo" id="logo-img">
        </div>

        <div class="message">
            Сайтът е в процес на разработка.<br>
            Намерете ни в социалните мрежи:
        </div>

        <div class="social-links">
            <a href="https://facebook.com/lazer.bg" target="_blank" class="social-btn" aria-label="Facebook">
                <i class="fab fa-facebook-f"></i>
            </a>
            <a href="https://instagram.com/lazer.bg" target="_blank" class="social-btn" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
        </div>
    </div>
</body>
</html>
